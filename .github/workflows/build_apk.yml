name: Build SherpaNav Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Official Android Harness & Restore Alpine Assets
        run: |
          cd sherpanav_mobile
          # Backup custom files
          cp pubspec.yaml /tmp/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          cp android/app/release.keystore /tmp/release.keystore
          
          # Remove manually created android folder and let Flutter generate canonical harness
          rm -rf android
          flutter create --platforms=android --org com.sherpanav .
          
          # Restore our custom configurations
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/release.keystore android/app/release.keystore

          # Apply permanent release signing with v1 and v2 scheme
          python3 configure_signing.py

      - name: Install Dependencies
        run: |
          cd sherpanav_mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd sherpanav_mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SherpaNav-Release-APK
          path: sherpanav_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-alpha
          name: "SherpaNav Mobile v1.0.0 (Release APK)"
          body: |
            ### 🏔️ SherpaNav Mobile v1.0.0
            - **100% Offline Himalayan Navigation & Topo Engine**
            - **21 Trails, 56 Routes & 405 Teahouses pre-loaded**
            - **Altitude & Barometer Sensor Telemetry**
            - **Lake Louise Clinical AMS Diagnostic Calculator**
            - **Emergency SOS & Telemetry Dispatcher**
          files: sherpanav_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build SherpaNav Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd sherpanav_mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd sherpanav_mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SherpaNav-Release-APK
          path: sherpanav_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-alpha
          name: "SherpaNav Mobile v1.0.0 (Release APK)"
          body: |
            ### 🏔️ SherpaNav Mobile v1.0.0
            - **100% Offline Himalayan Navigation & Topo Engine**
            - **21 Trails, 56 Routes & 405 Teahouses pre-loaded**
            - **Altitude & Barometer Sensor Telemetry**
            - **Lake Louise Clinical AMS Diagnostic Calculator**
            - **Emergency SOS & Telemetry Dispatcher**
          files: sherpanav_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

ext.flutter = [
    compileSdkVersion: 34,
    minSdkVersion: 21,
    targetSdkVersion: 34,
    versionCode: 1,
    versionName: "1.0"
]

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.ext.flutter = rootProject.ext.flutter
    project.ext.compileSdkVersion = 34
    project.ext.minSdkVersion = 21
    project.ext.targetSdkVersion = 34
    project.evaluationDependsOn(':app')
}

subprojects {
    afterEvaluate { p ->
        if (p.hasProperty('android')) {
            p.android {
                if (namespace == null) {
                    namespace p.group
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
